name: AQA Quality
on:
  pull_request:
    paths: ['aqa/**', '.github/workflows/aqa-*.yml', 'docs/homework8/**']
  push:
    branches: ['main', 'feature/homework8-aqa']
    paths: ['aqa/**', '.github/workflows/aqa-*.yml', 'docs/homework8/**']
permissions:
  contents: read
concurrency:
  group: aqa-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aqa/restaurant-aqa-framework
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject tracked generated files and secrets
        working-directory: .
        run: python3 aqa/restaurant-aqa-framework/scripts/audit-public.py --check
      - run: dotnet restore --locked-mode
      - run: dotnet format restaurant-aqa-framework.csproj --verify-no-changes --no-restore
      - run: dotnet build -c Release --no-restore
      - name: Gherkin lint
        run: npx --yes gherkin-lint@4.2.4 -c .gherkin-lintrc 'Features/*.feature'
      - name: Discover tests without credentials or network calls
        run: dotnet bin/Release/net10.0/restaurant-aqa-framework.dll --list-tests
